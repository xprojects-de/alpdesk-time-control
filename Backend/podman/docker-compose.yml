version: '3.8'

services:

  alpdesk-time-control:

    image: localhost/alpdesk/alpdesk-ai-worker:latest
    container_name: alpdesk-time-control

    expose:
      - "18000"

    environment:
      APP_USERNAME: "time-control"
      APP_PASSWORD: "alpdesk"

    restart: always

  caddy:
    image: caddy:latest
    container_name: caddy-proxy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

    depends_on:
      - alpdesk-time-control

    restart: always

volumes:
  caddy_data: