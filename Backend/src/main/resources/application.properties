# app settings
app.version=1.5
app.username=${APP_USERNAME\:time-control}
app.password=${APP_PASSWORD\:time-control}
app.logCliCommands=true
app.openBrowser=${OPEN_BROWSER\:true}
micronaut.application.name=time-control
app.launcher.title=Alpdesk TimeControl
micronaut.server.port=18000
# CORS Configuration
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.ui.allowed-origins[0]=http://localhost:4200
micronaut.server.cors.configurations.ui.allowed-methods[0]=GET
micronaut.server.cors.configurations.ui.allowed-methods[1]=POST
micronaut.server.cors.configurations.ui.allowed-methods[2]=PUT
micronaut.server.cors.configurations.ui.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.ui.allowed-methods[4]=OPTIONS
micronaut.server.cors.configurations.ui.allowed-headers[0]=Authorization
micronaut.server.cors.configurations.ui.allowed-headers[1]=Content-Type
micronaut.server.cors.configurations.ui.allowed-headers[2]=Accept
micronaut.server.cors.configurations.ui.allow-credentials=true
# Static Resources (Frontend)
micronaut.router.static-resources.public.mapping=/**
micronaut.router.static-resources.public.paths=classpath\:public
# File uploads (participant/measurement/result CSV and DSV-Wettkampfdatei XML imports - see
# ParticipantController/MeasurementController @Part endpoints). Micronaut's default max-file-size
# is only 1MB, too small for a real multi-hundred-row federation-style roster export (e.g.
# e2e-tests/kondi-federation); raised to comfortably cover even a large plain-text/XML import
# while still bounding memory usage on the venue laptop.
micronaut.server.multipart.max-file-size=20MB
micronaut.server.max-request-size=20MB
# security
micronaut.security.endpoints.login.enabled=true
micronaut.security.endpoints.login.path=/login
micronaut.security.token.jwt.enabled=true
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_GENERATOR_SIGNATURE_SECRET\:pleaseChangeThisSecretForANewOne}
micronaut.security.token.generator.access-token.expiration=86400
micronaut.security.enabled=true
micronaut.security.reject-not-found=true
# swagger and static resources
micronaut.security.intercept-url-map[0].pattern=/
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=/**/*.js
micronaut.security.intercept-url-map[1].access=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=/**/*.css
micronaut.security.intercept-url-map[2].access=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=/**/*.html
micronaut.security.intercept-url-map[3].access=isAnonymous()
micronaut.security.intercept-url-map[4].pattern=/**/*.ico
micronaut.security.intercept-url-map[4].access=isAnonymous()
micronaut.security.intercept-url-map[5].pattern=/**/*.png
micronaut.security.intercept-url-map[5].access=isAnonymous()
micronaut.security.intercept-url-map[6].pattern=/**/*.jpg
micronaut.security.intercept-url-map[6].access=isAnonymous()
micronaut.security.intercept-url-map[7].pattern=/**/*.svg
micronaut.security.intercept-url-map[7].access=isAnonymous()
micronaut.security.intercept-url-map[8].pattern=/swagger/**
micronaut.security.intercept-url-map[8].access=isAnonymous()
micronaut.security.intercept-url-map[9].pattern=/swagger-ui/**
micronaut.security.intercept-url-map[9].access=isAnonymous()
micronaut.security.intercept-url-map[10].pattern=/login
micronaut.security.intercept-url-map[10].access=isAnonymous()
micronaut.security.intercept-url-map[11].pattern=/**/*.woff
micronaut.security.intercept-url-map[11].access=isAnonymous()
micronaut.security.intercept-url-map[12].pattern=/**/*.woff2
micronaut.security.intercept-url-map[12].access=isAnonymous()
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.swagger-ui.paths=classpath\:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath\:META-INF/swagger
# logging
# micronaut.http.services.bitbucket.log-level=trace
# sqlite
datasources.default.db-type=sqlite
datasources.default.driver-class-name=org.sqlite.JDBC
# Pragmas are passed as URL query params (the SQLite JDBC driver's native config mechanism) and
# NOT via connection-init-sql: that property is handed to Statement.execute() as one call, and
# this driver only runs the first ';'-separated statement in a multi-pragma string, silently
# dropping the rest (verified directly against the driver - only foreign_keys took effect,
# journal_mode/busy_timeout silently stayed at their defaults).
# - foreign_keys: SQLite does not enforce foreign keys (and thus the schema's ON DELETE
#   CASCADE/SET NULL clauses) unless explicitly told to; without this, deleting e.g. a race
#   leaves its participants/race_measurements as silent orphans instead of cascading.
# - journal_mode=WAL: lets readers and a writer proceed concurrently instead of blocking
#   each other.
# - busy_timeout: makes a writer that does collide with another writer wait (and retry
#   internally) instead of failing immediately with SQLITE_BUSY.
# Both matter here because several browser tabs/devices can poll and write at the same time
# during a race.
datasources.default.url=jdbc:sqlite:database/time-control.db?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
# Spelled out rather than left to Hikari's default, which this happens to match (verified at
# runtime: maximumPoolSize=10, minimumIdle=10) - so the number is visible to anyone weighing it
# against SQLite's single-writer model instead of having to know the framework default.
#
# Deliberately NOT lowered to 1-2 "because SQLite has one writer": that confuses one writer with
# one connection. journal_mode=WAL above exists precisely so readers never queue behind the
# writer, and a pool of 1 would put every read - the participant list, the live results page each
# spectator device refreshes every 10s - in line behind every write. The writers that actually
# matter (device import, auto-assign, archive/reset) already serialise in-process on
# MeasurementTableLock long before the pool is reached.
#
# Measured before settling on this: 40 concurrent clients (20 writing, 20 reading) over 2000
# requests, with an archive fired into the middle of the load - 2000x HTTP 200, no SQLITE_BUSY,
# no errors. A race day runs one or two people entering results plus a handful of spectator
# devices. If contention ever does show up, raise busy_timeout first; shrinking the pool would
# trade a problem we do not have for one we would.
datasources.default.maximum-pool-size=10
# flyway
flyway.datasources.default.enabled=true
# data import
data-import.enabled=true
# Bounds how long a call to the timing device (192.168.4.1, a local WiFi AP) can block a thread.
# Without this, a device that accepts the TCP connection but never responds could hang a scheduled
# import or controller thread indefinitely; this is the only outbound @Client in the app, so a
# global setting is safe and does not affect any other HTTP client.
micronaut.http.client.connect-timeout=5s
micronaut.http.client.read-timeout=7s
# security
# Micronaut's management endpoints (/health, /beans, /loggers, /flyway, ...) come in through a dependency and
# are not used - /watchdog is the liveness probe. Off, so nothing about the application is exposed.
endpoints.all.enabled=false
