plugins {
    id("java")
    id("groovy")
    id("io.micronaut.application") version "5.0.2"
    id("com.gradleup.shadow") version "9.4.1"
    id("io.micronaut.aot") version "5.0.2"
}

version = "0.1"
group = "x.timecontrol"

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor("io.micronaut:micronaut-http-validation")
    annotationProcessor("io.micronaut.serde:micronaut-serde-processor")
    annotationProcessor("io.micronaut.openapi:micronaut-openapi")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    compileOnly("io.micronaut.openapi:micronaut-openapi-annotations")
    implementation("io.micronaut:micronaut-http-client")
    implementation("org.slf4j:slf4j-api")
    runtimeOnly("ch.qos.logback:logback-classic")
    testImplementation("io.micronaut:micronaut-http-client")
    // Needed for Spock's Mock() to mock concrete classes (e.g. the service classes under test),
    // not just interfaces - Spock's built-in java-proxy mocker only handles interfaces.
    testImplementation("net.bytebuddy:byte-buddy:1.17.5")
    testImplementation("org.objenesis:objenesis:3.4")
    annotationProcessor("io.micronaut.security:micronaut-security-processor")
    annotationProcessor("io.micronaut.security:micronaut-security-annotations")
    implementation("io.micronaut.security:micronaut-security")
    implementation("io.micronaut.security:micronaut-security-jwt")
    aotPlugins platform("io.micronaut.platform:micronaut-platform:5.1.0")
    aotPlugins("io.micronaut.security:micronaut-security-aot")
    implementation("io.micronaut.reactor:micronaut-reactor-http-client")
    runtimeOnly("io.micronaut.sql:micronaut-jdbc-sqlite:7.1.0")
    implementation("io.micronaut.flyway:micronaut-flyway:8.1.0")
    implementation("io.micronaut.data:micronaut-data-jdbc:5.1.1")
    runtimeOnly("io.micronaut.sql:micronaut-jdbc-hikari:7.1.0")
    implementation("org.apache.pdfbox:pdfbox:3.0.8")
}

application {
    mainClass = "x.timecontrol.Application"
}

java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.GRAAL_VM
    }
}

graalvmNative {
    toolchainDetection = true
    binaries {
        all {
            buildArgs.add("-H:+SharedArenaSupport")
            // Optional für SQLite JNI-Support:
            buildArgs.add("--enable-native-access=ALL-UNNAMED")
        }
    }
}

micronaut {
    runtime("netty")
    testRuntime("spock2")
    processing {
        incremental(true)
        annotations("x.timecontrol.*")
    }
    aot {
        // Please review carefully the optimizations enabled below
        // Check https://micronaut-projects.github.io/micronaut-aot/latest/guide/ for more details
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
        configurationProperties.put("micronaut.security.jwks.enabled", "false")
    }

}

tasks.named("dockerfile") {
    baseImage = "eclipse-temurin:25-jre"
}

tasks.withType(AbstractTestTask).configureEach {
    // Now that a real Spock suite exists, a misconfigured test source set or a broken Groovy/Spock
    // plugin wiring that silently drops every test should fail the build, not pass it by omission.
    failOnNoDiscoveredTests = true
}

shadowJar {
    archiveFileName = 'time-control.jar'
    manifest {
        attributes 'Main-Class': 'x.timecontrol.Application'
    }
    mergeServiceFiles()
}

// Task to copy Angular frontend to public directory
tasks.register('copyFrontend', Copy) {
    from '../Frontend/dist/time-control/browser'
    into 'src/main/resources/public'
    doFirst {
        println 'Cleaning public directory...'
        delete fileTree('src/main/resources/public') {
            exclude '.gitkeep' // Optional: Keep .gitkeep if present
        }
        println 'Copying Angular frontend to public directory...'
    }
    doLast {
        println 'Frontend copied successfully!'
    }
}

// jpackage: bundles the shadowJar with a jlinked Java 25 runtime into a self-contained,
// platform-native installer/app-image - a parallel, non-native-image alternative to
// `nativeCompile` that trades a larger download for not needing GraalVM reachability config.
def jpackagePlatform = org.gradle.internal.os.OperatingSystem.current().with {
    isMacOsX() ? 'macos' : (isWindows() ? 'windows' : 'linux')
}
def jpackageIconExtension = [macos: 'icns', windows: 'ico', linux: 'png'][jpackagePlatform]
def jpackageIcon = file("packaging/icons/app.${jpackageIconExtension}")
def jpackageInstallerType = [macos: 'dmg', windows: 'exe', linux: 'deb'][jpackagePlatform]
// jpackage wants a dotted numeric version, padded to at least 3 components ("0.1" -> "0.1.0").
// macOS additionally rejects a leading "0" (jpackage's mac bundler requires a positive first
// component), so only there a leading "1." is prepended ("0.1" -> "1.0.1") rather than
// overwriting the leading digit, to keep the original version numbers recognizable. This is
// just the installer's package version - the app's own displayed version (app.version,
// VersionController) is untouched.
def jpackageVersionParts = project.version.toString().tokenize('.')
if (jpackagePlatform == 'macos' && jpackageVersionParts[0] == '0') {
    jpackageVersionParts = ['1'] + jpackageVersionParts
}
def jpackageVersion = (jpackageVersionParts + ['0', '0']).take(Math.max(3, jpackageVersionParts.size())).join('.')

def jpackageExecutable = {
    def launcher = javaToolchains.launcherFor(java.toolchain).get()
    def javaBin = launcher.executablePath.asFile
    new File(javaBin.parentFile, jpackagePlatform == 'windows' ? 'jpackage.exe' : 'jpackage').absolutePath
}

def jpackageArgs = { String type, File destDir ->
    [
            '--input', file('build/libs').absolutePath,
            '--main-jar', 'time-control.jar',
            '--main-class', 'x.timecontrol.Application',
            '--name', 'Time Control',
            '--app-version', jpackageVersion,
            '--vendor', 'Alpdesk',
            '--icon', jpackageIcon.absolutePath,
            '--type', type,
            '--dest', destDir.absolutePath,
            // Only the jpackage build shows the status window - see DesktopWindowStartupListener.
            '--java-options', '-Dapp.showWindow=true',
    ]
}

// Fast, no extra OS tooling required (no WiX/dpkg) - good for local iteration.
tasks.register('jpackageAppImage', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained app image (bundled Java 25 runtime, no installer wrapper) via jpackage.'
    dependsOn tasks.named('shadowJar')
    def destDir = file('dist')
    doFirst {
        delete file('dist/Time Control.app'), file('dist/Time Control')
        destDir.mkdirs()
    }
    executable jpackageExecutable()
    args jpackageArgs('app-image', destDir)
}

// Produces the real one-click installer: .dmg (macOS), .exe (Windows, needs WiX Toolset),
// .deb (Linux, needs dpkg-deb, preinstalled on Debian/Ubuntu).
tasks.register('jpackageInstaller', Exec) {
    group = 'distribution'
    description = "Builds a native installer (.${jpackageInstallerType} on this OS) with a bundled Java 25 runtime via jpackage."
    dependsOn tasks.named('shadowJar')
    def destDir = file('dist')
    doFirst {
        destDir.mkdirs()
    }
    executable jpackageExecutable()
    args jpackageArgs(jpackageInstallerType, destDir)
}


