name: Build Native Installers (Mac & Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'Frontend/**'
      - '.github/workflows/build-installers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Build Angular
        working-directory: Frontend
        run: |
          npm ci --legacy-peer-deps
          npm run deploy

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 1

  build-native-installer:
    name: Build Installer on ${{ matrix.os }}
    needs: build-frontend
    # GraalVM native-image build disabled for now - we rely on the jpackage build instead.
    # Set this back to `true` (or remove the condition) to re-enable.
    if: false
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: Backend

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact-name: TimeControl-macOS.dmg
          - os: windows-latest
            platform: windows
            artifact-name: TimeControl-Windows-Setup.exe
          - os: ubuntu-latest
            platform: linux
            artifact-name: TimeControl-Linux.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          cache-dependency-path: Backend/build.gradle

      - name: Copy Frontend Assets to Backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat copyFrontend --no-daemon
          else
            chmod +x gradlew
            ./gradlew copyFrontend --no-daemon
          fi

      - name: Install create-dmg (macOS)
        if: matrix.platform == 'macos'
        run: brew install create-dmg

      - name: Build macOS Native Image
        if: matrix.platform == 'macos'
        run: ./gradlew nativeCompile --no-daemon

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        working-directory: .
        run: |
          mkdir -p Backend/dist
          create-dmg \
            --volname "Time Control" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "Backend/dist/${{ matrix.artifact-name }}" \
            "Backend/build/native/nativeCompile/"

      - name: Build Linux Native Image
        if: matrix.platform == 'linux'
        run: ./gradlew nativeCompile --no-daemon

      - name: Package Linux Archive
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact-name }}" -C build/native/nativeCompile time-control

      - name: Build Windows Native Image
        if: matrix.platform == 'windows'
        run: .\gradlew.bat nativeCompile --no-daemon

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y

      - name: Create Inno Setup Script
        if: matrix.platform == 'windows'
        working-directory: .
        shell: pwsh
        run: |
          $issContent = @'
          [Setup]
          AppName=Time Control
          AppVersion=0.1
          DefaultDirName={autopf}\TimeControl
          DefaultGroupName=Time Control
          OutputDir=Backend\dist
          OutputBaseFilename=TimeControl-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "Backend\build\native\nativeCompile\time-control.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Time Control"; Filename: "{app}\time-control.exe"
          Name: "{autodesktop}\Time Control"; Filename: "{app}\time-control.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\time-control.exe"; Description: "{cm:LaunchProgram,Time Control}"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path setup.iss -Value $issContent -Encoding UTF8

      - name: Build Windows Installer (.exe)
        if: matrix.platform == 'windows'
        working-directory: .
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: Backend/dist/*
          retention-days: 14

  build-shadow-jar:
    name: Build Shadow JAR (fallback, runs on any Java 25 JRE)
    needs: build-frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          cache-dependency-path: Backend/build.gradle

      - name: Copy Frontend Assets to Backend
        run: |
          chmod +x gradlew
          ./gradlew copyFrontend --no-daemon

      - name: Build Shadow JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Rename Shadow JAR for release
        run: |
          mkdir -p dist
          version=$(grep '^app.version=' src/main/resources/application.properties | cut -d'=' -f2)
          cp build/libs/time-control.jar "dist/Time-Control-java-v${version}.jar"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-jar
          path: Backend/dist/Time-Control-java-v*.jar
          retention-days: 14

  build-jpackage-installer:
    name: Build jpackage Installer on ${{ matrix.os }}
    needs: build-frontend
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: Backend

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          cache-dependency-path: Backend/build.gradle

      - name: Copy Frontend Assets to Backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat copyFrontend --no-daemon
          else
            chmod +x gradlew
            ./gradlew copyFrontend --no-daemon
          fi

      - name: Install WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        run: choco install wixtoolset -y

      - name: Build jpackage Installer
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat jpackageInstaller --no-daemon
          else
            ./gradlew jpackageInstaller --no-daemon
          fi

      - name: Rename Installer for Release
        shell: bash
        run: |
          version=$(grep '^app.version=' src/main/resources/application.properties | cut -d'=' -f2)
          for f in dist/*.dmg dist/*.exe dist/*.deb; do
            [ -e "$f" ] || continue
            mv "$f" "dist/Time-Control-java-v${version}.${f##*.}"
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-jpackage-installer
          path: |
            Backend/dist/*.dmg
            Backend/dist/*.exe
            Backend/dist/*.deb
          retention-days: 14

  build-macos-intel-bundle:
    name: Build macOS Intel (x64) App Bundle
    # Companion to the shadow JAR for Intel Macs: jpackage/nativeCompile can only target the
    # architecture of the runner they execute on, and GitHub's macOS runners are arm64 now
    # (macos-13, the last Intel-hosted one, is being phased out) - so there's no practical way
    # to jpackage-build for x64 macOS here. Instead this downloads a prebuilt x64 JRE (never
    # executed, just unpacked - no macOS/x64 runner needed) and wraps it with the shadow JAR in
    # a plain .app bundle, giving Intel Mac users a double-clickable app without a separate
    # Java install. It's unsigned, so Gatekeeper will require a one-time right-click > Open.
    needs: build-shadow-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-jar
          path: shadow-jar

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Download macOS x64 JRE (Temurin, Java 25)
        run: |
          curl -fL "https://api.adoptium.net/v3/binary/latest/25/ga/mac/x64/jre/hotspot/normal/eclipse" -o jre-mac-x64.tar.gz
          mkdir -p TimeControl.app/Contents/PlugIns/jre
          tar xzf jre-mac-x64.tar.gz -C TimeControl.app/Contents/PlugIns/jre --strip-components=1

      - name: Assemble TimeControl.app Bundle
        env:
          APP_VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          APP=TimeControl.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp shadow-jar/Time-Control-java-v*.jar "$APP/Contents/Resources/app.jar"
          cp Backend/packaging/icons/app.icns "$APP/Contents/Resources/app.icns"

          # Mirrors the jpackage build's --java-options (see build.gradle jpackageArgs): keeps
          # the data directory (SQLite DB, JWT secret) anchored to the user's home instead of
          # the app bundle's own location, and enables the AWT/Swing startup status window.
          cat > "$APP/Contents/MacOS/TimeControl" <<'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")/.." && pwd)"
          exec "$DIR/PlugIns/jre/Contents/Home/bin/java" -Dapp.packaged=true -Djava.awt.headless=false -jar "$DIR/Resources/app.jar"
          SCRIPT
          chmod +x "$APP/Contents/MacOS/TimeControl"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TimeControl</string>
              <key>CFBundleIconFile</key>
              <string>app.icns</string>
              <key>CFBundleIdentifier</key>
              <string>de.alpdesk.timecontrol</string>
              <key>CFBundleName</key>
              <string>Time Control</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
          </dict>
          </plist>
          PLIST

      - name: Zip App Bundle
        run: |
          mkdir -p dist
          zip -r -X -y "dist/Time-Control-macOS-Intel-v${{ steps.read_version.outputs.version }}.zip" TimeControl.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-bundle
          path: dist/Time-Control-macOS-Intel-v*.zip
          retention-days: 14

  create-release:
    name: Create GitHub Release
    # build-native-installer is currently skipped (see above) - not listed here, otherwise
    # this job would be skipped too since a skipped dependency doesn't count as successful.
    needs: [ build-jpackage-installer, build-shadow-jar, build-macos-intel-bundle ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten Directory Structure
        run: |
          mkdir -p final-assets
          cp release-assets/*-installer/* final-assets/
          cp release-assets/shadow-jar/* final-assets/
          cp release-assets/macos-intel-bundle/* final-assets/

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release v${{ steps.read_version.outputs.version }} (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}