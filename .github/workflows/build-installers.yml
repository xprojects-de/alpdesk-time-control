name: Build Native Installers (Mac & Windows)

# Started by hand (Actions -> this workflow -> Run workflow), never automatically.
#
# It used to run on every push to main, which was safe while main received nothing but releases.
# Contributions now arrive as pull requests against main, so that trigger would publish on every
# merge - and because the release is tagged v<app.version>, a merge without a version bump would
# rewrite the existing release of that version, replacing the installers people download with a
# build nobody decided to ship.
#
# Publishing is therefore a deliberate act: raise app.version, merge what belongs in the release,
# then start this workflow. Pull requests are still checked automatically by pr-checks.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Build Angular
        working-directory: Frontend
        run: |
          npm ci
          npm run deploy

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 1

  build-native-installer:
    name: Build Installer on ${{ matrix.os }}
    needs: build-frontend
    # GraalVM native-image build disabled for now - we rely on the jpackage build instead.
    # Set this back to `true` (or remove the condition) to re-enable.
    if: false
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: Backend

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact-name: TimeControl-macOS.dmg
          - os: windows-latest
            platform: windows
            artifact-name: TimeControl-Windows-Setup.exe
          - os: ubuntu-latest
            platform: linux
            artifact-name: TimeControl-Linux.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          cache-dependency-path: Backend/build.gradle

      - name: Copy Frontend Assets to Backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat copyFrontend --no-daemon
          else
            chmod +x gradlew
            ./gradlew copyFrontend --no-daemon
          fi

      - name: Install create-dmg (macOS)
        if: matrix.platform == 'macos'
        run: brew install create-dmg

      - name: Build macOS Native Image
        if: matrix.platform == 'macos'
        run: ./gradlew nativeCompile --no-daemon

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        working-directory: .
        run: |
          mkdir -p Backend/dist
          create-dmg \
            --volname "Time Control" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "Backend/dist/${{ matrix.artifact-name }}" \
            "Backend/build/native/nativeCompile/"

      - name: Build Linux Native Image
        if: matrix.platform == 'linux'
        run: ./gradlew nativeCompile --no-daemon

      - name: Package Linux Archive
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact-name }}" -C build/native/nativeCompile time-control

      - name: Build Windows Native Image
        if: matrix.platform == 'windows'
        run: .\gradlew.bat nativeCompile --no-daemon

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y

      - name: Create Inno Setup Script
        if: matrix.platform == 'windows'
        working-directory: .
        shell: pwsh
        run: |
          $issContent = @'
          [Setup]
          AppName=Time Control
          AppVersion=0.1
          DefaultDirName={autopf}\TimeControl
          DefaultGroupName=Time Control
          OutputDir=Backend\dist
          OutputBaseFilename=TimeControl-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "Backend\build\native\nativeCompile\time-control.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Time Control"; Filename: "{app}\time-control.exe"
          Name: "{autodesktop}\Time Control"; Filename: "{app}\time-control.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\time-control.exe"; Description: "{cm:LaunchProgram,Time Control}"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path setup.iss -Value $issContent -Encoding UTF8

      - name: Build Windows Installer (.exe)
        if: matrix.platform == 'windows'
        working-directory: .
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: Backend/dist/*
          retention-days: 14

  build-shadow-jar:
    name: Build Shadow JAR (fallback, runs on any Java 25 JRE)
    needs: build-frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          cache-dependency-path: Backend/build.gradle

      - name: Copy Frontend Assets to Backend
        run: |
          chmod +x gradlew
          ./gradlew copyFrontend --no-daemon

      - name: Build Shadow JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Rename Shadow JAR for release
        run: |
          mkdir -p dist
          version=$(grep '^app.version=' src/main/resources/application.properties | cut -d'=' -f2)
          cp build/libs/time-control.jar "dist/Time-Control-java-v${version}.jar"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-jar
          path: Backend/dist/Time-Control-java-v*.jar
          retention-days: 14

  build-jpackage-installer:
    name: Build jpackage Installer on ${{ matrix.os }}
    needs: build-frontend
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: Backend

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          cache-dependency-path: Backend/build.gradle

      - name: Copy Frontend Assets to Backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat copyFrontend --no-daemon
          else
            chmod +x gradlew
            ./gradlew copyFrontend --no-daemon
          fi

      - name: Install WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        run: choco install wixtoolset -y

      - name: Build jpackage Installer
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat jpackageInstaller --no-daemon
          else
            ./gradlew jpackageInstaller --no-daemon
          fi

      - name: Rename Installer for Release
        shell: bash
        run: |
          version=$(grep '^app.version=' src/main/resources/application.properties | cut -d'=' -f2)
          for f in dist/*.dmg dist/*.exe dist/*.deb; do
            [ -e "$f" ] || continue
            mv "$f" "dist/Time-Control-java-v${version}.${f##*.}"
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-jpackage-installer
          path: |
            Backend/dist/*.dmg
            Backend/dist/*.exe
            Backend/dist/*.deb
          retention-days: 14

  build-macos-intel-bundle:
    name: Build macOS Intel (x64) App Bundle
    # Companion to the shadow JAR for Intel Macs: jpackage/nativeCompile can only target the
    # architecture of the runner they execute on, and GitHub's macOS runners are arm64 now
    # (macos-13, the last Intel-hosted one, is being phased out) - so there's no practical way
    # to jpackage-build for x64 macOS here. Instead this downloads a prebuilt x64 JRE (never
    # executed, just unpacked - no macOS/x64 runner needed) and wraps it with the shadow JAR in
    # a plain .app bundle, giving Intel Mac users a double-clickable app without a separate
    # Java install. It's unsigned, so Gatekeeper requires a one-time approval via System Settings
    # > Privacy & Security - macOS 15 removed the old right-click > Open bypass.
    needs: build-shadow-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-jar
          path: shadow-jar

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Download macOS x64 JRE (Temurin, Java 25)
        run: |
          curl -fL "https://api.adoptium.net/v3/binary/latest/25/ga/mac/x64/jre/hotspot/normal/eclipse" -o jre-mac-x64.tar.gz
          mkdir -p TimeControl.app/Contents/PlugIns/jre
          tar xzf jre-mac-x64.tar.gz -C TimeControl.app/Contents/PlugIns/jre --strip-components=1

      - name: Assemble TimeControl.app Bundle
        env:
          APP_VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          APP=TimeControl.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp shadow-jar/Time-Control-java-v*.jar "$APP/Contents/Resources/app.jar"
          cp Backend/packaging/icons/app.icns "$APP/Contents/Resources/app.icns"

          # Mirrors the jpackage build's --java-options (see build.gradle jpackageArgs): keeps
          # the data directory (SQLite DB, JWT secret) anchored to the user's home instead of
          # the app bundle's own location, and enables the AWT/Swing startup status window.
          cat > "$APP/Contents/MacOS/TimeControl" <<'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")/.." && pwd)"
          exec "$DIR/PlugIns/jre/Contents/Home/bin/java" -Dapp.packaged=true -Djava.awt.headless=false -jar "$DIR/Resources/app.jar"
          SCRIPT
          chmod +x "$APP/Contents/MacOS/TimeControl"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TimeControl</string>
              <key>CFBundleIconFile</key>
              <string>app.icns</string>
              <key>CFBundleIdentifier</key>
              <string>de.alpdesk.timecontrol</string>
              <key>CFBundleName</key>
              <string>Time Control</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
          </dict>
          </plist>
          PLIST

      - name: Zip App Bundle
        run: |
          mkdir -p dist
          zip -r -X -y "dist/Time-Control-macOS-Intel-v${{ steps.read_version.outputs.version }}.zip" TimeControl.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-bundle
          path: dist/Time-Control-macOS-Intel-v*.zip
          retention-days: 14

  build-macos-intel-poorman-bundle:
    name: Build macOS Intel (x64) Poor-Man Bundle
    # Installer-free companion to the .app bundle above, for Intel Mac users who'd rather
    # inspect/run a plain folder (jre/ + jar + .command launcher) than a double-clickable .app.
    # Same unsigned Gatekeeper caveat as the .app bundle - this doesn't avoid that, it's purely
    # an alternate, more transparent packaging of the same JRE+jar combo.
    needs: build-shadow-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-jar
          path: shadow-jar

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Download macOS x64 JRE (Temurin, Java 25)
        run: |
          BUNDLE="Time-Control-macOS-Intel-PoorMan"
          mkdir -p "$BUNDLE/jre"
          curl -fL "https://api.adoptium.net/v3/binary/latest/25/ga/mac/x64/jre/hotspot/normal/eclipse" -o jre-mac-x64.tar.gz
          tar xzf jre-mac-x64.tar.gz -C "$BUNDLE/jre" --strip-components=1

      - name: Assemble Bundle
        run: |
          BUNDLE="Time-Control-macOS-Intel-PoorMan"
          cp shadow-jar/Time-Control-java-v*.jar "$BUNDLE/time-control.jar"

          # Mirrors the jpackage build's --java-options (see build.gradle jpackageArgs): keeps
          # the data directory (SQLite DB, JWT secret) anchored to the user's home instead of
          # the process's working directory, and enables the AWT/Swing startup status window.
          cat > "$BUNDLE/start.command" <<'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "$DIR/jre/Contents/Home/bin/java" -Dapp.packaged=true -Djava.awt.headless=false -jar "$DIR/time-control.jar"
          SCRIPT
          chmod +x "$BUNDLE/start.command"

          cat > "$BUNDLE/README.txt" <<'EOF'
          Time Control - manueller Start (ohne Installer)

          1. Diesen Ordner an einen beliebigen Ort entpacken.
          2. Doppelklick auf "start.command".
             Beim ersten Start blockiert macOS die Datei, weil sie nicht signiert
             ist (Gatekeeper). Freigeben ueber: Systemeinstellungen > Datenschutz
             & Sicherheit > "Trotzdem oeffnen", danach erneut doppelklicken.
             Alternativ im Terminal einmalig:
               xattr -rd com.apple.quarantine <dieser Ordner>
          3. Browser oeffnet sich automatisch, sonst http://localhost:18000 aufrufen.
          EOF

      - name: Zip Bundle
        run: |
          mkdir -p dist
          zip -r -X -y "dist/Time-Control-macOS-Intel-PoorMan-v${{ steps.read_version.outputs.version }}.zip" Time-Control-macOS-Intel-PoorMan

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-poorman-bundle
          path: dist/Time-Control-macOS-Intel-PoorMan-v*.zip
          retention-days: 14

  build-macos-applesilicon-poorman-bundle:
    name: Build macOS Apple Silicon (arm64) Poor-Man Bundle
    # Poor-man bundle for Apple Silicon Macs. Not a cross-arch workaround like the Intel .app
    # above (build-jpackage-installer already produces a native arm64 .dmg on GitHub's arm64
    # runners) - it's the same installer-free JRE+jar+script alternative, for consistency with
    # the Intel and Windows poor-man bundles.
    needs: build-shadow-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-jar
          path: shadow-jar

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Download macOS arm64 JRE (Temurin, Java 25)
        run: |
          BUNDLE="Time-Control-macOS-AppleSilicon-PoorMan"
          mkdir -p "$BUNDLE/jre"
          curl -fL "https://api.adoptium.net/v3/binary/latest/25/ga/mac/aarch64/jre/hotspot/normal/eclipse" -o jre-mac-aarch64.tar.gz
          tar xzf jre-mac-aarch64.tar.gz -C "$BUNDLE/jre" --strip-components=1

      - name: Assemble Bundle
        run: |
          BUNDLE="Time-Control-macOS-AppleSilicon-PoorMan"
          cp shadow-jar/Time-Control-java-v*.jar "$BUNDLE/time-control.jar"

          # Mirrors the jpackage build's --java-options (see build.gradle jpackageArgs): keeps
          # the data directory (SQLite DB, JWT secret) anchored to the user's home instead of
          # the process's working directory, and enables the AWT/Swing startup status window.
          cat > "$BUNDLE/start.command" <<'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "$DIR/jre/Contents/Home/bin/java" -Dapp.packaged=true -Djava.awt.headless=false -jar "$DIR/time-control.jar"
          SCRIPT
          chmod +x "$BUNDLE/start.command"

          cat > "$BUNDLE/README.txt" <<'EOF'
          Time Control - manueller Start (ohne Installer)

          1. Diesen Ordner an einen beliebigen Ort entpacken.
          2. Doppelklick auf "start.command".
             Beim ersten Start blockiert macOS die Datei, weil sie nicht signiert
             ist (Gatekeeper). Freigeben ueber: Systemeinstellungen > Datenschutz
             & Sicherheit > "Trotzdem oeffnen", danach erneut doppelklicken.
             Alternativ im Terminal einmalig:
               xattr -rd com.apple.quarantine <dieser Ordner>
          3. Browser oeffnet sich automatisch, sonst http://localhost:18000 aufrufen.
          EOF

      - name: Zip Bundle
        run: |
          mkdir -p dist
          zip -r -X -y "dist/Time-Control-macOS-AppleSilicon-PoorMan-v${{ steps.read_version.outputs.version }}.zip" Time-Control-macOS-AppleSilicon-PoorMan

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-applesilicon-poorman-bundle
          path: dist/Time-Control-macOS-AppleSilicon-PoorMan-v*.zip
          retention-days: 14

  build-windows-poorman-bundle:
    name: Build Windows Poor-Man Bundle (JRE + Shadow JAR)
    # Companion to the jpackage .exe/.msi for Windows users hit by AV/SmartScreen false
    # positives: a freshly-built, unsigned native launcher has zero reputation and gets flagged
    # by heuristic engines regardless of installer format. This wraps the shadow JAR with an
    # already-signed, widely-trusted Adoptium JRE and a plain .bat launcher instead - no native
    # executable of ours in the bundle at all, so there's nothing for AV heuristics to flag.
    needs: build-shadow-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-jar
          path: shadow-jar

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Download Windows x64 JRE (Temurin, Java 25)
        run: |
          curl -fL "https://api.adoptium.net/v3/binary/latest/25/ga/windows/x64/jre/hotspot/normal/eclipse" -o jre-windows-x64.zip
          mkdir -p jre-extracted bundle/jre
          unzip -q jre-windows-x64.zip -d jre-extracted
          mv jre-extracted/*/* bundle/jre/

      - name: Assemble Bundle
        run: |
          cp shadow-jar/Time-Control-java-v*.jar bundle/time-control.jar

          # Mirrors the jpackage build's --java-options (see build.gradle jpackageArgs): keeps
          # the data directory (SQLite DB, JWT secret) anchored to the user's home instead of
          # the process's working directory, and explicitly enables the AWT/Swing startup
          # status window (matches the Mac bundles' -Djava.awt.headless=false, rather than
          # relying on Windows' own default). "pause" at the end keeps the console window open
          # if the app exits/crashes immediately, so errors stay visible instead of flashing by.
          cat > bundle/start.bat <<'SCRIPT'
          @echo off
          "%~dp0jre\bin\java.exe" -Dapp.packaged=true -Djava.awt.headless=false -jar "%~dp0time-control.jar"
          pause
          SCRIPT

          cat > bundle/README.txt <<'EOF'
          Time Control - manueller Start (ohne Installer)

          1. Diesen Ordner an einen beliebigen Ort entpacken.
          2. Doppelklick auf "start.bat".
             Falls Windows SmartScreen warnt: "Weitere Informationen" > "Trotzdem ausfuehren".
          3. Browser oeffnet sich automatisch, sonst http://localhost:18000 aufrufen.
          EOF

      - name: Zip Bundle
        run: |
          mkdir -p dist
          (cd bundle && zip -r -X -y "../dist/Time-Control-Windows-PoorMan-v${{ steps.read_version.outputs.version }}.zip" .)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-poorman-bundle
          path: dist/Time-Control-Windows-PoorMan-v*.zip
          retention-days: 14

  build-linux-x64-server-bundle:
    name: Build Linux x64 Server Bundle (headless)
    # Headless server companion to the desktop bundles above: no browser auto-open, explicit
    # java.awt.headless instead of relying on auto-detection (the code already degrades
    # gracefully without a display - see DesktopWindowStartupListener/BrowserStartupListener -
    # this just makes the intent explicit), plus a systemd unit template for running as a
    # proper boot-time service on a headless Linux box instead of a desktop app.
    needs: build-shadow-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-jar
          path: shadow-jar

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Download Linux x64 JRE (Temurin, Java 25)
        run: |
          BUNDLE="Time-Control-Linux-x64-Server"
          mkdir -p "$BUNDLE/jre"
          curl -fL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jre/hotspot/normal/eclipse" -o jre-linux-x64.tar.gz
          tar xzf jre-linux-x64.tar.gz -C "$BUNDLE/jre" --strip-components=1

      - name: Assemble Bundle
        run: |
          BUNDLE="Time-Control-Linux-x64-Server"
          cp shadow-jar/Time-Control-java-v*.jar "$BUNDLE/time-control.jar"

          cat > "$BUNDLE/start.sh" <<'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/jre/bin/java" -Dapp.packaged=true -Djava.awt.headless=true -Dapp.openBrowser=false -jar "$DIR/time-control.jar"
          SCRIPT
          chmod +x "$BUNDLE/start.sh"

          cat > "$BUNDLE/time-control.service" <<'EOF'
          [Unit]
          Description=Time Control Zeitmessung
          After=network.target

          [Service]
          Type=simple
          ExecStart=/opt/time-control/start.sh
          WorkingDirectory=/opt/time-control
          Restart=on-failure
          User=pi

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > "$BUNDLE/README.txt" <<'EOF'
          Time Control - Server-Betrieb (headless, ohne Installer)

          1. Ordner nach /opt/time-control entpacken, z.B.:
             sudo mkdir -p /opt/time-control
             sudo tar xzf Time-Control-Linux-x64-Server-*.tar.gz --strip-components=1 -C /opt/time-control

          2. time-control.service pruefen/anpassen (Pfad/User falls abweichend) und installieren:
             sudo cp /opt/time-control/time-control.service /etc/systemd/system/
             sudo systemctl daemon-reload
             sudo systemctl enable --now time-control

          3. Status/Logs pruefen:
             systemctl status time-control
             journalctl -u time-control -f

          4. Ohne systemd testweise manuell starten:
             ./start.sh
          EOF

      - name: Tar Bundle
        run: |
          mkdir -p dist
          tar czf "dist/Time-Control-Linux-x64-Server-v${{ steps.read_version.outputs.version }}.tar.gz" Time-Control-Linux-x64-Server

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-server-bundle
          path: dist/Time-Control-Linux-x64-Server-v*.tar.gz
          retention-days: 14

  build-linux-aarch64-server-bundle:
    name: Build Linux AArch64 Server Bundle (headless, e.g. Raspberry Pi)
    # Same as the x64 server bundle above, for arm64 boards (Raspberry Pi 4/5 on 64-bit
    # Raspberry Pi OS) - currently the only Linux target with zero coverage otherwise
    # (build-jpackage-installer only runs on ubuntu-latest, which is x64).
    needs: build-shadow-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Shadow JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-jar
          path: shadow-jar

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Download Linux arm64 JRE (Temurin, Java 25)
        run: |
          BUNDLE="Time-Control-Linux-AArch64-Server"
          mkdir -p "$BUNDLE/jre"
          curl -fL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/aarch64/jre/hotspot/normal/eclipse" -o jre-linux-aarch64.tar.gz
          tar xzf jre-linux-aarch64.tar.gz -C "$BUNDLE/jre" --strip-components=1

      - name: Assemble Bundle
        run: |
          BUNDLE="Time-Control-Linux-AArch64-Server"
          cp shadow-jar/Time-Control-java-v*.jar "$BUNDLE/time-control.jar"

          cat > "$BUNDLE/start.sh" <<'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/jre/bin/java" -Dapp.packaged=true -Djava.awt.headless=true -Dapp.openBrowser=false -jar "$DIR/time-control.jar"
          SCRIPT
          chmod +x "$BUNDLE/start.sh"

          cat > "$BUNDLE/time-control.service" <<'EOF'
          [Unit]
          Description=Time Control Zeitmessung
          After=network.target

          [Service]
          Type=simple
          ExecStart=/opt/time-control/start.sh
          WorkingDirectory=/opt/time-control
          Restart=on-failure
          User=pi

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > "$BUNDLE/README.txt" <<'EOF'
          Time Control - Server-Betrieb (headless, ohne Installer)

          1. Ordner nach /opt/time-control entpacken, z.B.:
             sudo mkdir -p /opt/time-control
             sudo tar xzf Time-Control-Linux-AArch64-Server-*.tar.gz --strip-components=1 -C /opt/time-control

          2. time-control.service pruefen/anpassen (Pfad/User falls abweichend) und installieren:
             sudo cp /opt/time-control/time-control.service /etc/systemd/system/
             sudo systemctl daemon-reload
             sudo systemctl enable --now time-control

          3. Status/Logs pruefen:
             systemctl status time-control
             journalctl -u time-control -f

          4. Ohne systemd testweise manuell starten:
             ./start.sh
          EOF

      - name: Tar Bundle
        run: |
          mkdir -p dist
          tar czf "dist/Time-Control-Linux-AArch64-Server-v${{ steps.read_version.outputs.version }}.tar.gz" Time-Control-Linux-AArch64-Server

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-server-bundle
          path: dist/Time-Control-Linux-AArch64-Server-v*.tar.gz
          retention-days: 14

  create-release:
    name: Create GitHub Release
    # build-native-installer is currently skipped (see above) - not listed here, otherwise
    # this job would be skipped too since a skipped dependency doesn't count as successful.
    needs: [ build-jpackage-installer, build-shadow-jar, build-macos-intel-bundle, build-macos-intel-poorman-bundle, build-macos-applesilicon-poorman-bundle, build-windows-poorman-bundle, build-linux-x64-server-bundle, build-linux-aarch64-server-bundle ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten Directory Structure
        run: |
          mkdir -p final-assets
          cp release-assets/*-installer/* final-assets/
          cp release-assets/shadow-jar/* final-assets/
          cp release-assets/macos-intel-bundle/* final-assets/
          cp release-assets/macos-intel-poorman-bundle/* final-assets/
          cp release-assets/macos-applesilicon-poorman-bundle/* final-assets/
          cp release-assets/windows-poorman-bundle/* final-assets/
          cp release-assets/linux-x64-server-bundle/* final-assets/
          cp release-assets/linux-aarch64-server-bundle/* final-assets/

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      # One release per app.version, tagged v<app.version> (e.g. v1.5). main is only ever built
      # on a release, and raising app.version is part of making one, so the version identifies
      # the release exactly.
      #
      # This deliberately no longer uses github.run_number ("release-<n>"): that counter belongs
      # to the repository, so it restarted at 1 when the project moved here, while the tags
      # release-9 … release-24 came along from the previous repository. Run 9 would have tried to
      # create a tag that already exists and points at a commit from August.
      #
      # Re-running the workflow for an unchanged app.version updates that version's existing
      # release rather than adding a second one - which is what you want when a runner failed and
      # the build is simply repeated. Publishing a genuinely new build means raising app.version.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.read_version.outputs.version }}
          name: Release v${{ steps.read_version.outputs.version }}
          draft: false
          prerelease: false
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}