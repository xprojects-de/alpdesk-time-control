name: Build Native Installers (Mac & Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'Frontend/**'
      - '.github/workflows/build-installers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Build Angular
        working-directory: Frontend
        run: |
          npm ci --legacy-peer-deps
          npm run deploy

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 1

  build-native-installer:
    name: Build Installer on ${{ matrix.os }}
    needs: build-frontend
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: Backend

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact-name: TimeControl-macOS.dmg
          - os: windows-latest
            platform: windows
            artifact-name: TimeControl-Windows-Setup.exe
          - os: ubuntu-latest
            platform: linux
            artifact-name: TimeControl-Linux.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          cache-dependency-path: Backend/build.gradle

      - name: Copy Frontend Assets to Backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat copyFrontend --no-daemon
          else
            chmod +x gradlew
            ./gradlew copyFrontend --no-daemon
          fi

      - name: Install create-dmg (macOS)
        if: matrix.platform == 'macos'
        run: brew install create-dmg

      - name: Build macOS Native Image
        if: matrix.platform == 'macos'
        run: ./gradlew nativeCompile --no-daemon

      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        working-directory: .
        run: |
          mkdir -p Backend/dist
          create-dmg \
            --volname "Time Control" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "Backend/dist/${{ matrix.artifact-name }}" \
            "Backend/build/native/nativeCompile/"

      - name: Build Linux Native Image
        if: matrix.platform == 'linux'
        run: ./gradlew nativeCompile --no-daemon

      - name: Package Linux Archive
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact-name }}" -C build/native/nativeCompile time-control

      - name: Build Windows Native Image
        if: matrix.platform == 'windows'
        run: .\gradlew.bat nativeCompile --no-daemon

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y

      - name: Create Inno Setup Script
        if: matrix.platform == 'windows'
        working-directory: .
        shell: pwsh
        run: |
          $issContent = @'
          [Setup]
          AppName=Time Control
          AppVersion=0.1
          DefaultDirName={autopf}\TimeControl
          DefaultGroupName=Time Control
          OutputDir=Backend\dist
          OutputBaseFilename=TimeControl-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "Backend\build\native\nativeCompile\time-control.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Time Control"; Filename: "{app}\time-control.exe"
          Name: "{autodesktop}\Time Control"; Filename: "{app}\time-control.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\time-control.exe"; Description: "{cm:LaunchProgram,Time Control}"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path setup.iss -Value $issContent -Encoding UTF8

      - name: Build Windows Installer (.exe)
        if: matrix.platform == 'windows'
        working-directory: .
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: Backend/dist/*
          retention-days: 14

  build-jpackage-installer:
    name: Build jpackage Installer (${{ matrix.platform }}-${{ matrix.arch }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: Backend

    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact-name: TimeControl-macOS-arm64.dmg

          # Intel Macs
          - os: macos-13
            platform: macos
            arch: x86_64
            artifact-name: TimeControl-macOS-x86_64.dmg

          # Windows
          - os: windows-latest
            platform: windows
            arch: x64
            artifact-name: TimeControl-Windows-Setup.exe

          # Linux
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact-name: TimeControl-Linux.deb

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Setup GraalVM Java 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          cache-dependency-path: Backend/build.gradle

      - name: Copy Frontend Assets to Backend
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat copyFrontend --no-daemon
          else
            chmod +x gradlew
            ./gradlew copyFrontend --no-daemon
          fi

      - name: Install WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        run: choco install wixtoolset -y

      - name: Build jpackage Installer
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat jpackageInstaller --no-daemon
          else
            ./gradlew jpackageInstaller --no-daemon
          fi

      - name: Rename macOS DMG with Architecture
        if: matrix.platform == 'macos'
        run: |
          mv Backend/dist/*.dmg "Backend/dist/${{ matrix.artifact-name }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-jpackage-installer
          path: |
            Backend/dist/*.dmg
            Backend/dist/*.exe
            Backend/dist/*.deb
          retention-days: 14

  create-release:
    name: Create GitHub Release
    needs: [ build-native-installer, build-jpackage-installer ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten Directory Structure
        run: |
          mkdir -p final-assets
          find release-assets/ -type f -exec cp {} final-assets/ \;

      - name: Read App Version
        id: read_version
        run: echo "version=$(grep -oP '(?<=^app.version=).*' Backend/src/main/resources/application.properties)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release v${{ steps.read_version.outputs.version }} (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}